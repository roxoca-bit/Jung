<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#100f1c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Creative Portfolio · iPhone</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;color:#fff;background:#0d0d15;-webkit-font-smoothing:antialiased}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;overflow:hidden}
    button,input,textarea{font:inherit}
    button{cursor:pointer;-webkit-tap-highlight-color:transparent}
    button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #64b5ff;outline-offset:3px}
    .stage{width:100%;height:100dvh;display:grid;place-items:center;background:radial-gradient(circle at 50% 25%,#29283b,#090b14 75%);overflow:hidden}
    .phone{position:relative;width:min(100vw,calc(100dvh * .475),430px);height:min(100dvh,calc(100vw / .475),930px);overflow:hidden;isolation:isolate;background:#10111c url("assets/wallpaper.jpg") center center / cover no-repeat;box-shadow:0 18px 70px rgba(0,0,0,.58);border-radius:34px}
    .phone::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(10,11,24,.34),transparent 29%,transparent 63%,rgba(7,8,17,.49))}
    .statusbar{height:43px;position:absolute;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:4px 25px 0;font-size:15px;font-weight:650;letter-spacing:-.35px;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.25)}
    .status-right{display:flex;gap:6px;align-items:center}
    .signal{display:flex;align-items:flex-end;gap:2px;height:14px}
    .signal i{display:block;width:3px;background:currentColor;border-radius:2px}.signal i:nth-child(1){height:5px}.signal i:nth-child(2){height:8px}.signal i:nth-child(3){height:11px}.signal i:nth-child(4){height:14px}
    .network{font-size:13px;margin-left:1px}
    .battery{position:relative;margin-left:3px;border:1.4px solid currentColor;border-radius:5px;height:14px;min-width:26px;display:grid;place-items:center;font-size:10px;line-height:1;letter-spacing:-.2px}
    .battery::after{content:"";position:absolute;right:-3px;top:4px;width:2px;height:5px;border-radius:0 3px 3px 0;background:currentColor}
    .home{position:absolute;inset:0;z-index:2}
    .home-main{position:absolute;top:7.8%;left:4.35%;right:4.35%}
    .widgets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3.7%;width:100%}
    .widget-wrap{min-width:0}
    .widget{appearance:none;border:0;text-align:left;display:block;width:100%;aspect-ratio:1/1;border-radius:20px;position:relative;padding:13px 14px;overflow:hidden;box-shadow:0 2px 15px rgba(0,0,0,.05)}
    .weather-widget{color:white;background:linear-gradient(147deg,rgba(112,159,198,.93),rgba(165,184,213,.82));text-shadow:0 1px 3px rgba(70,75,102,.07)}
    .w-place{font-size:12px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
    .w-temp{font-size:53px;font-weight:250;line-height:1.12;letter-spacing:-4px;margin-top:9px}
    .w-bottom{position:absolute;left:14px;right:10px;bottom:14px}
    .w-emoji{font-size:18px;line-height:1.5}.w-desc,.w-highlow{font-size:12px;line-height:1.4;font-weight:450}
    .calendar-widget{background:rgba(255,255,255,.96);color:#121212}
    .cal-week{font-size:13px;font-weight:700}.cal-day{font-size:61px;line-height:1.1;letter-spacing:-3px;font-weight:350;margin-top:5px}
    .cal-event{position:absolute;bottom:32px;left:14px;right:10px;color:#888;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .widget-label{font-size:11px;text-align:center;line-height:1.2;text-shadow:0 1px 3px #111;opacity:.97;margin-top:7px}
    .apps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:80px;row-gap:14px;margin-top:18px}
    .app-shortcut{appearance:none;border:0;background:transparent;color:inherit;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
    .app-icon{width:55px;height:55px;border-radius:13px;display:grid;place-items:center;background:#fefefe;box-shadow:0 2px 9px rgba(0,0,0,.12);overflow:hidden;flex-shrink:0}
    .app-icon svg{width:100%;height:100%;display:block}
    .app-name{display:block;font-size:11px;font-weight:430;white-space:nowrap;text-shadow:0 1px 4px rgba(0,0,0,.75);max-width:100%;text-overflow:ellipsis;overflow:hidden}
    .search-pill{position:absolute;left:50%;bottom:119px;transform:translateX(-50%);border:0;border-radius:28px;background:rgba(45,46,49,.82);backdrop-filter:blur(15px);color:white;font-size:12px;padding:6px 14px;text-shadow:0 1px 3px #222}
    .dock{position:absolute;left:3.6%;right:3.6%;bottom:30px;height:83px;border:1px solid rgba(255,255,255,.26);border-radius:29px;background:rgba(65,66,71,.73);backdrop-filter:blur(24px) saturate(120%);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:center;justify-items:center;padding:0 8px}
    .dock .app-shortcut{gap:0}.dock .app-icon{width:55px;height:55px}.dock .app-name{display:none}
    .home-indicator{z-index:35;position:absolute;bottom:9px;width:34%;height:5px;left:33%;border-radius:8px;background:white;box-shadow:0 1px 3px rgba(0,0,0,.32);cursor:pointer}
    .lockscreen{position:absolute;inset:0;z-index:22;touch-action:pan-y;user-select:none;background:linear-gradient(180deg,rgba(12,12,26,.16),transparent 65%,rgba(9,9,22,.32)),url("assets/wallpaper.jpg") center center / cover no-repeat;transition:transform .45s cubic-bezier(.3,.7,.2,1),opacity .45s}
    .lockscreen.unlocked{transform:translateY(-101%);opacity:0;pointer-events:none}
    .lock-top{position:absolute;top:9%;left:0;right:0;text-align:center;text-shadow:0 2px 15px rgba(0,0,0,.25)}
    .lock-date{font-size:20px;letter-spacing:-.2px;font-weight:500}.lock-time{font-size:76px;font-weight:200;line-height:1.18;letter-spacing:-4px}
    .lock-bottom{position:absolute;bottom:66px;left:0;right:0;text-align:center}
    .swipe-hint{font-size:14px;letter-spacing:.1px;color:rgba(255,255,255,.93);background:transparent;border:0;padding:12px 10px;animation:hint 2.8s infinite}
    .lock-caret{display:block;font-size:24px;line-height:12px;font-weight:200;margin-bottom:8px}
    @keyframes hint{50%{transform:translateY(-5px)}}
    .lock-glow{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.24),transparent 38%,rgba(0,0,0,.12));pointer-events:none}
    .app-layer{position:absolute;inset:0;z-index:12;background:#f6f6f9;color:#171820;display:none;flex-direction:column;padding-top:46px}
    .app-layer.active{display:flex;animation:appear .24s ease-out}
    @keyframes appear{from{opacity:.6;transform:translateY(20px) scale(.985)}to{opacity:1;transform:none}}
    .phone.app-open .statusbar,.phone.search-open .statusbar{color:#151515;text-shadow:none}
    .phone.app-open .home-indicator,.phone.search-open .home-indicator{background:#171717;box-shadow:none}
    .app-nav{height:47px;min-height:47px;padding:0 17px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ebebee;background:#fff}
    .app-nav strong{font-size:16px;font-weight:690}.back-btn,.nav-action{border:0;background:transparent;color:#247be9;padding:10px 0;font-size:14px;min-width:55px}.nav-action{text-align:right}
    .app-content{flex:1;min-height:0;overflow-y:auto;padding:22px 20px 45px;overscroll-behavior:contain}
    .app-section{max-width:550px;margin:auto}.eyebrow{color:#718096;font-size:11px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase}
    .hero-heading{font-size:32px;line-height:1.16;letter-spacing:-1.2px;margin:11px 0 12px;font-weight:790}.muted{font-size:14px;line-height:1.75;color:#69707c}
    .sheet{background:white;border:1px solid #ececf1;border-radius:19px;padding:20px;margin-top:16px;box-shadow:0 5px 18px rgba(31,36,53,.035)}
    .sheet h3{margin:0 0 9px;font-size:15px}.sheet p{font-size:14px;line-height:1.65;color:#69707c;margin:0}
    .minor{font-size:12px;color:#8b8f99}.chip{display:inline-block;border-radius:20px;padding:8px 11px;background:#f0f3f7;color:#4a5261;font-size:12px;margin:3px}
    .cta{border:0;background:#1f2937;color:white;border-radius:13px;padding:12px 17px;font-weight:650;font-size:13px;margin-top:14px}.cta.secondary{background:#edf1f5;color:#2f4052}
    .field{border:1px solid #e4e7ee;background:white;border-radius:12px;padding:12px 14px;font-size:14px;width:100%;color:#171820}
    .notes-area{min-height:52vh;resize:vertical;line-height:1.8;background:repeating-linear-gradient(#fff 0,#fff 36px,#e9edf2 37px);padding:16px;border:1px solid #e7e9ef;border-radius:12px;font-size:15px;width:100%;color:#222}
    .gallery-shot{width:100%;max-height:58vh;object-fit:contain;background:#101221;border-radius:15px}
    .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px}.tile{aspect-ratio:1;border:0;border-radius:7px;background:linear-gradient(160deg,#313755,#b18bb2 60%,#eed7ca);color:white;font-size:10px;text-align:left;padding:11px;display:flex;align-items:end;font-weight:650}.tile:nth-child(2){background:linear-gradient(150deg,#104d69,#86c2cb)}.tile:nth-child(3){background:linear-gradient(150deg,#201b23,#9b654d)}.tile:nth-child(4){background:linear-gradient(150deg,#26404a,#adc4cb)}.tile:nth-child(5){background:linear-gradient(150deg,#5f516c,#d1a7c3)}.tile:nth-child(6){background:linear-gradient(150deg,#333b30,#9c9e7b)}
    .avatar{width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,#f0b9c0,#6d709b);display:grid;place-items:center;font-size:27px;color:white;font-weight:700;flex-shrink:0}
    .profile-row{display:flex;gap:15px;align-items:center}.profile-info{display:flex;gap:17px;font-size:12px;text-align:center}.profile-info strong{display:block;font-size:16px}
    .msg-row{display:flex;align-items:center;gap:12px;border-bottom:1px solid #f0f1f4;padding:14px 0}.msg-icon{display:grid;place-items:center;border-radius:14px;width:49px;height:49px;background:#dff2e4;color:#237e4c;font-size:22px}
    .search-layer{position:absolute;inset:0;z-index:13;background:rgba(247,247,251,.98);padding:61px 20px 30px;color:#1b1e29;display:none}.search-layer.active{display:block}
    .search-box{background:#e7e8ee;border-radius:13px;padding:10px 14px;display:flex;align-items:center;gap:10px}.search-box input{width:100%;border:0;outline:none;background:transparent;font-size:15px}
    .search-results{display:grid;grid-template-columns:repeat(4,1fr);gap:17px 6px;margin-top:28px}.search-results .app-name{color:#333;text-shadow:none}
    .search-close{margin-top:13px;background:transparent;border:0;color:#2973d2;font-size:14px;float:right}
    .app-note{font-size:12px;color:#858b96;margin-top:18px;line-height:1.7}
    .toast{z-index:40;position:absolute;left:50%;bottom:138px;transform:translateX(-50%);background:rgba(20,20,26,.86);border-radius:20px;padding:8px 13px;color:white;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}.toast.show{opacity:1}
    @media(max-width:480px){.stage{display:block}.phone{height:100dvh;width:100vw;max-height:none;max-width:none;border-radius:0;box-shadow:none}.statusbar{padding-top:max(4px,env(safe-area-inset-top));height:calc(43px + env(safe-area-inset-top) * .4)}.home-main{top:max(7.8%,calc(env(safe-area-inset-top) + 40px))}.dock{bottom:max(30px,calc(env(safe-area-inset-bottom) + 18px))}.home-indicator{bottom:max(9px,env(safe-area-inset-bottom))}.search-pill{bottom:max(119px,calc(env(safe-area-inset-bottom) + 105px))}}
    @media(max-height:740px){.home-main{top:7.2%}.widget{border-radius:17px;padding:11px}.w-temp{font-size:47px}.cal-day{font-size:52px}.apps{margin-top:13px;grid-auto-rows:73px;row-gap:9px}.app-icon,.dock .app-icon{width:48px;height:48px}.dock{height:74px}.search-pill{bottom:107px}.cal-event{bottom:22px}}
    @media(min-width:481px){.phone{border:1px solid rgba(255,255,255,.24)}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
<div class="stage">
  <main class="phone" id="phone" aria-label="포트폴리오 아이폰 시뮬레이터">
    <div class="statusbar" aria-label="상태 표시줄">
      <span id="statusTime">--:--</span>
      <div class="status-right"><span class="signal" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="network">5G</span><span class="battery" id="battery">75</span></div>
    </div>

    <section class="home" id="home" aria-label="홈 화면">
      <div class="home-main">
        <div class="widgets">
          <div class="widget-wrap">
            <button class="widget weather-widget" type="button" data-app="weather" aria-label="현재 날씨 정보">
              <div class="w-place" id="weatherPlace">위치 확인 중</div>
              <div class="w-temp" id="weatherTemp">--°</div>
              <div class="w-bottom"><div class="w-emoji" id="weatherEmoji">☁️</div><div class="w-desc" id="weatherDesc">날씨 불러오는 중</div><div class="w-highlow" id="weatherRange">최고:--° 최저:--°</div></div>
            </button>
            <div class="widget-label">날씨</div>
          </div>
          <div class="widget-wrap">
            <button class="widget calendar-widget" type="button" data-app="calendar" aria-label="오늘 날짜 보기">
              <div class="cal-week" id="widgetWeek">목요일</div>
              <div class="cal-day" id="widgetDay">12</div>
              <div class="cal-event">오늘 이벤트 없음</div>
            </button>
            <div class="widget-label">캘린더</div>
          </div>
        </div>
        <div class="apps" id="appGrid" aria-label="앱 목록"></div>
      </div>
      <button class="search-pill" id="openSearch" type="button">⌕ 검색</button>
      <div class="dock" id="dock" aria-label="독 앱"></div>
    </section>

    <section class="app-layer" id="appLayer" aria-label="앱 화면">
      <div class="app-nav"><button class="back-btn" id="backHome" type="button">‹ 홈</button><strong id="appTitle">앱</strong><button class="nav-action" id="appAction" type="button" hidden>완료</button></div>
      <div class="app-content" id="appContent"></div>
    </section>

    <section class="search-layer" id="searchLayer" aria-label="앱 검색">
      <div class="search-box"><span>⌕</span><input id="searchInput" placeholder="앱 검색" type="search" autocomplete="off" aria-label="앱 검색어" /></div>
      <button class="search-close" id="closeSearch" type="button">취소</button>
      <div class="search-results" id="searchResults"></div>
    </section>

    <div class="toast" id="toast" aria-live="polite"></div>
    <div class="home-indicator" id="homeIndicator" role="button" tabindex="0" aria-label="홈으로 돌아가기"></div>
    <section class="lockscreen" id="lockscreen" aria-label="잠금 화면">
      <div class="lock-glow"></div>
      <div class="lock-top"><div class="lock-date" id="lockDate">11월 12일 목요일</div><div class="lock-time" id="lockTime">15:15</div></div>
      <div class="lock-bottom"><button id="unlockBtn" class="swipe-hint" type="button"><span class="lock-caret">⌃</span>위로 쓸어올려 잠금 해제</button></div>
    </section>
  </main>
</div>
<script>
(() => {
  'use strict';
  // === 여기서 앱 이름 및 순서를 자유롭게 수정할 수 있어요. ===
  const APP_GRID = [
    ['kakao','카카오톡'],['instagram','인스타그램'],['chat','Chat AI'],['youtube','유튜브'],
    ['melon','멜론'],['wiki','인생위키'],['photos','사진'],['calendar','캘린더'],
    ['camera','카메라'],['notes','메모'],['appstore','App Store']
  ];
  const DOCK_GRID = [['phone','전화'],['safari','Safari'],['messages','메시지'],['melon','멜론']];
  const $ = id => document.getElementById(id);
  const phone = $('phone');
  let activeApp = null;
  let isUnlocked = false;
  let lastWeather = null;
  let lastWeatherPlace = '서울특별시 · 기본 위치';
  let toastTimer;
  const pad = num => String(num).padStart(2,'0');
  const weekFormatter = new Intl.DateTimeFormat('ko-KR',{weekday:'long'});
  const monthDayFormatter = new Intl.DateTimeFormat('ko-KR',{month:'long',day:'numeric',weekday:'long'});
  const svg = (content, extra='') => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true" ${extra}>${content}</svg>`;

  function iconMarkup(id) {
    switch(id){
      case 'kakao': return svg(`<rect width="64" height="64" rx="13" fill="#FFE600"/><path d="M32 11C18.2 11 8 19.3 8 30.3c0 7.2 4.6 13.2 11.8 16.7L17 55l11.3-6.4c1.2.2 2.4.3 3.7.3 13.7 0 24.8-8.5 24.8-19S45.7 11 32 11Z" fill="#35221B"/><text x="32" y="34" fill="#FFE600" font-weight="900" font-size="16" text-anchor="middle" font-family="Arial,sans-serif">TALK</text>`);
      case 'instagram': return svg(`<defs><linearGradient id="ig" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#f9cb56"/><stop offset=".35" stop-color="#f34657"/><stop offset=".66" stop-color="#ca2dbb"/><stop offset="1" stop-color="#5c43df"/></linearGradient></defs><rect width="64" height="64" rx="13" fill="url(#ig)"/><rect x="14" y="14" width="36" height="36" rx="11" fill="none" stroke="white" stroke-width="5"/><circle cx="32" cy="32" r="9" fill="none" stroke="white" stroke-width="5"/><circle cx="44" cy="20" r="3" fill="white"/>`);
      case 'chat': return svg(`<rect width="64" height="64" rx="13" fill="#FFF"/>${Array.from({length:30},(_,i)=>{const a=i*12;return `<path d="M32 16 L32 29" stroke="#131313" stroke-linecap="round" stroke-width="2.5" transform="rotate(${a} 32 32)"/>`}).join('')}<circle cx="32" cy="32" r="3" fill="#131313"/>`);
      case 'youtube': return svg(`<rect width="64" height="64" rx="13" fill="#fff"/><rect x="10" y="18" width="44" height="28" rx="10" fill="#FF122B"/><path d="M28 24.5 42 32l-14 7.5Z" fill="white"/>`);
      case 'melon': return svg(`<rect width="64" height="64" rx="13" fill="#fff"/><defs><linearGradient id="ml" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#45ee6a"/><stop offset="1" stop-color="#08b354"/></linearGradient><filter id="sh"><feGaussianBlur stdDeviation="1.4"/></filter></defs><circle cx="32" cy="32" r="16" fill="none" stroke="#d1d8d6" stroke-width="5" opacity=".9"/><circle cx="32" cy="32" r="14.3" fill="none" stroke="url(#ml)" stroke-width="4"/><circle cx="32" cy="32" r="8.4" fill="#f9faf9"/>`);
      case 'wiki': return svg(`<defs><linearGradient id="wk" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#60f1a4"/><stop offset="1" stop-color="#0bab5e"/></linearGradient></defs><rect width="64" height="64" rx="13" fill="url(#wk)"/><rect x="15" y="12" width="34" height="41" rx="4" fill="#f9fff3"/><rect x="18" y="12" width="5" height="41" fill="#e0ffdd"/><path d="M41 12h7v13l-3.5-3-3.5 3Z" fill="#ffcf62"/><path d="M28 31h14M28 37h14M28 43h10" stroke="#57c895" stroke-width="2.5" stroke-linecap="round"/><path d="M31 22c5-5 9 1 4 4-3 1-5-1-4-4Z" fill="#66cf8c"/>`);
      case 'photos': return svg(`<rect width="64" height="64" rx="13" fill="white"/>${['#f03855','#fd8509','#ffd324','#5ac652','#1ab7ad','#3578e7','#744ae5','#e044bd'].map((c,i)=>`<ellipse cx="32" cy="22.6" rx="7.2" ry="12.8" fill="${c}" opacity=".93" transform="rotate(${i*45} 32 32)"/>`).join('')}<circle cx="32" cy="32" r="4.5" fill="#fff6de" opacity=".8"/>`);
      case 'calendar': { const n = new Date(); const d=n.getDate(),w=weekFormatter.format(n); return svg(`<rect width="64" height="64" rx="13" fill="white"/><text x="32" y="17" text-anchor="middle" font-size="10.5" font-family="sans-serif" fill="#171717">${w}</text><text x="32" y="48" text-anchor="middle" font-size="32" font-family="Arial,sans-serif" font-weight="300" fill="#161616">${d}</text>`); }

  // 날씨: Open-Meteo 무료 API. iOS 기본 날씨 앱 데이터에 접근하는 것은 웹에서 불가능합니다.
  const SEOUL={latitude:37.5665,longitude:126.9780};
  const descriptionForCode=(code,isDay=true)=>{
    if(code===0)return [isDay?'☀️':'🌙','맑음'];
    if(code===1)return [isDay?'🌤️':'🌙','대체로 맑음'];
    if(code===2)return ['⛅','구름 조금'];
    if(code===3)return ['☁️','흐림'];
    if([45,48].includes(code))return ['🌫️','안개'];
    if([51,53,55,56,57].includes(code))return ['🌦️','이슬비'];
    if([61,63,65,66,67,80,81,82].includes(code))return ['🌧️','비'];
    if([71,73,75,77,85,86].includes(code))return ['❄️','눈'];
    if([95,96,99].includes(code))return ['⛈️','뇌우'];
    return ['☁️','날씨 정보'];
  };
  async function fetchWeather(lat,lon,place){
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${encodeURIComponent(lat)}&longitude=${encodeURIComponent(lon)}&current=temperature_2m,weather_code,is_day&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1`;
    const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),12000);
    try {
      const response=await fetch(url,{signal:controller.signal});
      if(!response.ok)throw Error('날씨 요청 실패');
      const data=await response.json();
      if(!data.current || !data.daily)throw Error('날씨 응답 오류');
      const code=data.current.weather_code;
      const [emoji,desc]=descriptionForCode(code,Boolean(data.current.is_day));
      lastWeather={temp:Math.round(data.current.temperature_2m),max:Math.round(data.daily.temperature_2m_max[0]),min:Math.round(data.daily.temperature_2m_min[0]),emoji,desc};
      lastWeatherPlace=place;
      $('weatherPlace').textContent=place;
      $('weatherTemp').textContent=`${lastWeather.temp}°`;
      $('weatherEmoji').textContent=emoji;
      $('weatherDesc').textContent=desc;
      $('weatherRange').textContent=`최고:${lastWeather.max}° 최저:${lastWeather.min}°`;
      if(activeApp==='weather')showWeatherContent();
    }catch(err){
      console.warn('날씨 업데이트 오류:',err);
      if(!lastWeather){$('weatherPlace').textContent='날씨 연결 실패';$('weatherDesc').textContent='눌러서 다시 시도';}
    }finally{clearTimeout(timeout);}
  }
  function requestLiveWeather(){
    if(!navigator.geolocation){fetchWeather(SEOUL.latitude,SEOUL.longitude,'서울특별시 · 기본 위치');return;}
    // 날씨 요청이 허용되지 않을 경우에도 서울 기본 예보가 표시됩니다.
    navigator.geolocation.getCurrentPosition(
      pos=>fetchWeather(pos.coords.latitude,pos.coords.longitude,'현재 위치'),
      ()=>fetchWeather(SEOUL.latitude,SEOUL.longitude,'서울특별시 · 기본 위치'),
      {enableHighAccuracy:false,timeout:9000,maximumAge:10*60*1000}
    );
  }
  fetchWeather(SEOUL.latitude,SEOUL.longitude,'서울특별시 · 기본 위치');
  setInterval(()=>{if(isUnlocked)requestLiveWeather();},30*60*1000);

  phone.addEventListener('touchend',e=>{if(gestureStart!==null){if(gestureStart-e.changedTouches[0].clientY>48)goHome();gestureStart=null;}},{passive:true});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&isUnlocked)goHome();});

  function closeSearch(){ $('searchLayer').classList.remove('active');phone.classList.remove('search-open'); }
  function populateSearch(q=''){
    const source=[...APP_GRID,...DOCK_GRID].filter(([id],i,arr)=>arr.findIndex(([s])=>s===id)===i);
    const filtered=source.filter(([,label])=>label.toLowerCase().includes(q.toLowerCase()));
    $('searchResults').replaceChildren(...filtered.map(shortcut));
    if(!filtered.length)$('searchResults').textContent='검색 결과가 없어요.';
  }
  $('openSearch').addEventListener('click',()=>{populateSearch();$('searchLayer').classList.add('active');phone.classList.add('search-open');$('searchInput').value='';$('searchInput').focus();});
  $('closeSearch').addEventListener('click',closeSearch);
  $('searchInput').addEventListener('input',e=>populateSearch(e.target.value));

  async function tryBattery(){
    if(typeof navigator.getBattery!=='function')return;
    try{const b=await navigator.getBattery();const update=()=>$('battery').textContent=Math.round(b.level*100);update();b.addEventListener('levelchange',update);}catch(e){}
  }
  drawIcons();refreshTime();setInterval(refreshTime,15000);tryBattery();
})();
</script>
</body>
</html>
